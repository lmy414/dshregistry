<h1>dsh-dev-http-tools · Web 技术</h1>
<h2>工具</h2>
<ul>
<li><code>list_webtech</code>：列出 Web 技术 条目。</li>
<li><code>get_webtech</code>：按 id 或名称查询 Web 技术 条目详情。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-dev-http-tools
</code></pre>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-dev-http-tools
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
