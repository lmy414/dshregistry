<h1>dsh-buenos-aires-city · 布宜诺斯艾利斯市</h1>
<h2>工具</h2>
<ul>
<li><code>city_info</code>：返回 布宜诺斯艾利斯市（Buenos Aires）的undefined信息。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-buenos-aires-city
</code></pre>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-buenos-aires-city
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
