<p><strong>DSH Web 会话输入框的极简输入历史插件：空输入框时按 ↑/↓ 翻阅之前发过的消息，仅此而已。</strong></p>
<h2>安装</h2>
<pre><code>dsh plugin --profile &lt;你的profile名&gt; add dsh-keyboard-history
</code></pre>
<p>装好后重启 <code>dsh web</code> 即可生效。</p>
<h2>使用</h2>
<ul>
<li><strong>↑</strong>：空输入框时召回上一条已发送的消息，继续按回翻更早</li>
<li><strong>↓</strong>：向新翻，越过最新一条回到空框</li>
<li>编辑、发送后自动退出翻阅；斜杠菜单、中文输入法、会话忙碌等场景下不打扰你</li>
</ul>
