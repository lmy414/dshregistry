<h1>dsh-html-parse · HTML 解析</h1>
<p>从 HTML 文件/字符串提取标题、meta 描述、标题层级、链接、表格、纯文本等结构化数据。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>parse_html</code></td>
<td>提取标题/链接/标题层级/表格/文本</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-html-parse
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-html-parse"</code>。</p>
<h2>用法示例</h2>
<pre><code>解析这个 HTML 文件，提取标题和所有链接
→ 调用 parse_html(file="page.html")
</code></pre>
