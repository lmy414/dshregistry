<h1>dsh-comoros · 科摩罗国</h1>
<h2>工具</h2>
<ul>
<li><code>country_info</code>：返回 科摩罗（Comoros）的首都、人口（万）、货币与大洲。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-comoros
</code></pre>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-comoros
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
