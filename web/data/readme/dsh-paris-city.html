<h1>dsh-paris-city · 巴黎市</h1>
<h2>工具</h2>
<ul>
<li><code>city_info</code>：返回 巴黎市（Paris）的undefined信息。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-paris-city
</code></pre>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-paris-city
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
