<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="/assets/logo.webp">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <title>页面不存在 · DSH-Registry</title>
    <style>
/* dshregistry 404 — 设计令牌节选自原型 colors_and_type.css(明暗双主题) */
:root {
  --dsh-radius-md: 6px;
  --dsh-radius-full: 9999px;
  --dsh-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --dsh-bg: #ffffff; --dsh-bg-subtle: #f6f8fa;
  --dsh-border: #d0d7de; --dsh-border-muted: #e6eaef;
  --dsh-fg: #1f2328; --dsh-fg-muted: #656d76;
  --dsh-primary: #0969da; --dsh-primary-subtle: #ddf4ff;
}
html.dark {
  --dsh-bg: #0d1117; --dsh-bg-subtle: #161b22;
  --dsh-border: #30363d; --dsh-border-muted: #21262d;
  --dsh-fg: #e6edf3; --dsh-fg-muted: #9198a1;
  --dsh-primary: #4493f8; --dsh-primary-subtle: rgba(68,147,248,0.12);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--dsh-bg); color: var(--dsh-fg);
  font-family: var(--dsh-font-sans); font-size: 14px; text-align: center; padding: 24px;
}
.brand { display: flex; align-items: center; gap: 8px; color: var(--dsh-fg); text-decoration: none; font-weight: 600; margin-bottom: 32px; }
.brand img { width: 28px; height: 28px; }
.code { font-size: 64px; font-weight: 700; color: var(--dsh-primary); letter-spacing: 2px; }
.title { font-size: 18px; font-weight: 600; margin: 8px 0; }
.desc { color: var(--dsh-fg-muted); margin-bottom: 24px; }
.home-btn {
  display: inline-flex; align-items: center; height: 32px; padding: 0 14px;
  font-size: 13px; font-weight: 500; color: var(--dsh-primary);
  background: var(--dsh-primary-subtle); border: 1px solid var(--dsh-primary);
  border-radius: var(--dsh-radius-md); cursor: pointer; text-decoration: none;
}
.nav-utils { position: fixed; top: 16px; right: 16px; display: flex; gap: 8px; }
.nav-utils button {
  height: 28px; padding: 0 10px; font-size: 12px; cursor: pointer;
  color: var(--dsh-fg-muted); background: var(--dsh-bg-subtle);
  border: 1px solid var(--dsh-border-muted); border-radius: var(--dsh-radius-full);
}
.nav-utils button.active { color: var(--dsh-primary); border-color: var(--dsh-primary); }
    </style>

</head>
<body>
  <div class="nav-utils">
    <div class="lang-toggle" role="group" aria-label="语言切换" style="display:flex;gap:4px;">
      <button class="active">中</button><button>EN</button>
    </div>
    <button class="theme-toggle" aria-label="切换主题">☾</button>
  </div>
  <a href="/index.html" class="brand"><img src="/assets/logo.webp" alt="DSH-Registry"><span>DSH-Registry</span></a>
  <div class="code">404</div>
  <div class="title" id="t404-title">页面不存在</div>
  <div class="desc" id="t404-desc">你访问的页面或插件不存在,可能已被移除。</div>
  <a class="home-btn" href="/index.html" id="t404-back">返回插件市场</a>
  <script src="/assets/shared.js"></script>
  <script>
    function sync404() {
      document.title = DSHR.t('title.404')
      document.getElementById('t404-title').textContent = DSHR.lang() === 'zh' ? '页面不存在' : 'Page not found'
      document.getElementById('t404-desc').textContent = DSHR.lang() === 'zh' ? '你访问的页面或插件不存在,可能已被移除。' : 'The page or plugin you requested does not exist or may have been removed.'
      document.getElementById('t404-back').textContent = DSHR.lang() === 'zh' ? '返回插件市场' : 'Back to marketplace'
    }
    DSHR.onReady(sync404)
    DSHR.onLangChange(sync404)
  </script>

</html>
