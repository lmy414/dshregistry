<h1>dsh-jwt · JWT 解码</h1>
<p>解析 JWT 的 header/payload，判断是否过期（不验签）。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>jwt_decode</code></td>
<td>解码 JWT</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-jwt
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-jwt"</code>。</p>
<h2>用法示例</h2>
<pre><code>看看这个 token 里有什么、过期没有
→ 调用 jwt_decode(token="eyJhbGci...")
</code></pre>
