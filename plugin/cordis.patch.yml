# dsh-marketplace bundle 配置层:安装后由 dsh plugin 追加进 profile 的 bundles 列表,
# 在此层插入插件行。插件代码按包名引用(loader 从 profile node_modules 解析)。

- insert:
    - id: dsh-marketplace
      name: 'dsh-marketplace'
      config:
        # registryBaseUrl: 'https://dshregistry.xyz'  # 注册中心(静态数据源)
        # profile: 'web'                              # 要操作的 DSH profile(双环境:WSL 侧填 web-wsl)
        # pnpmTimeoutMs: 180000                       # pnpm 安装超时(毫秒)
        # cacheTtlMs: 300000                           # registry 数据缓存(毫秒)
