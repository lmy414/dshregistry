<h1>dsh-json-tools · JSON 规范化</h1>
<p>递归排序 JSON 键、美化/压缩 JSON。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>json_sort</code></td>
<td>递归排序对象键</td>
</tr>
<tr>
<td><code>json_format</code></td>
<td>美化/压缩 JSON</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-json-tools
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-json-tools"</code>。</p>
<h2>用法示例</h2>
<pre><code>把这段 JSON 的键排序，便于 diff
→ 调用 json_sort(data={b:1,a:2})
</code></pre>
