<h1>dsh-http · HTTP 请求工具</h1>
<p>发起 HTTP 请求，返回状态码、响应头、响应体（截断）与耗时。纯 Node（fetch）实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>http_request</code></td>
<td>发请求 → 状态/响应头/响应体/耗时</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-http
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-http"</code>。</p>
<h2>用法示例</h2>
<pre><code>请求这个接口看看返回什么
→ 调用 http_request(url="https://api.example.com/ping")
</code></pre>
