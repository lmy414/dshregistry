# 拦截直接IP访问 (返回444断开连接)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    # 使用自签名证书 (避免报错)
    ssl_certificate /etc/letsencrypt/live/dshregistry.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dshregistry.xyz/privkey.pem;

    server_name _;

    # 返回444 (Nginx特殊状态码,直接断开连接)
    return 444;
}
