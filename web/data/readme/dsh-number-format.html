<h1>dsh-number-format · 数字格式化</h1>
<p>千分位、小数位、货币符号、百分比格式化。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>format_number</code></td>
<td>数字格式化</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-number-format
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-number-format"</code>。</p>
<h2>用法示例</h2>
<pre><code>把 1234567.891 格式化成货币
→ 调用 format_number(value=1234567.891, currency="¥", decimals=2)
</code></pre>
