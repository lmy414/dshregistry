<h1>dsh-future-robot-pet · 机器宠物</h1>
<h2>工具</h2>
<ul>
<li><code>list_robot-pet</code>：列出 机器宠物 条目。</li>
<li><code>get_robot-pet</code>：按 id 或名称查询 机器宠物 条目详情。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-future-robot-pet
</code></pre>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-future-robot-pet
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
