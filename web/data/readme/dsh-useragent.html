<h1>dsh-useragent · User-Agent 解析</h1>
<p>解析 User-Agent 字符串，识别浏览器/版本、操作系统、设备类型、引擎与爬虫。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>parse_ua</code></td>
<td>解析 UA 字符串</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-useragent
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-useragent"</code>。</p>
<h2>用法示例</h2>
<pre><code>这个 UA 是什么浏览器和系统
→ 调用 parse_ua(ua="Mozilla/5.0 ... Chrome/120 ...")
</code></pre>
