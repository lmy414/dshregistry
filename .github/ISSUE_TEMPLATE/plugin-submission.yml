name: 收录插件 / Submit a plugin
description: 提交你的 DSH 插件收录申请(无需 fork 本仓库)
title: "[收录] owner/repo"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交!收录条件:仓库声明 `dsh.bundle.patch`、有 README、有 LICENSE。
        **收录不等于审计**:收录后插件默认标记为「未审计 Unreviewed」。
  - type: input
    id: repo
    attributes:
      label: 仓库地址
      description: 形如 owner/name(GitHub 公开仓库)
      placeholder: owner/name
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 分类
      description: 可选,缺省由爬虫自动推断
      options:
        - tool
        - vision
        - dashboard
        - bridge
        - launcher
        - mcp
        - skill
        - other
  - type: textarea
    id: note
    attributes:
      label: 一句话说明
      description: 可选;插件内容保持原文,不翻译
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我的仓库已声明 dsh.bundle.patch,且有 README 与 LICENSE
          required: true
        - label: 我理解收录不等于审计,收录后默认标记为「未审计」
          required: true
