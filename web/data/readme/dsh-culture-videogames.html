<h1>dsh-culture-videogames · 电子游戏类型</h1>
<h2>工具</h2>
<ul>
<li><code>list_videogame</code>：列出 电子游戏类型 条目。</li>
<li><code>get_videogame</code>：按 id 或名称查询 电子游戏类型 条目详情。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-culture-videogames
</code></pre>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-culture-videogames
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
