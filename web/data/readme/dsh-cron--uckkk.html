<h1>dsh-cron · Cron 解析</h1>
<p>解析 5 字段 cron 表达式，返回人类可读描述与接下来 N 次执行时间。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>cron_parse</code></td>
<td>解析 cron 表达式 → 描述 + 下次执行时间</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-cron
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-cron"</code>。</p>
<h2>用法示例</h2>
<pre><code>这个 cron 表达式什么时候跑
→ 调用 cron_parse(expr="*/5 * * * *", count=5)
</code></pre>
