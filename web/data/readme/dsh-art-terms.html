<h1>dsh-art-terms · 艺术术语</h1>
<h2>工具</h2>
<ul>
<li><code>list_art</code>：列出 艺术术语 知识条目。</li>
<li><code>get_art</code>：按 id 或名称查询 艺术术语 条目详情。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-art-terms
</code></pre>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-art-terms
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
