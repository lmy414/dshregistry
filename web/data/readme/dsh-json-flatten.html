<h1>dsh-json-flatten · JSON 扁平化</h1>
<p>嵌套 JSON ↔ 点号扁平键互转（数组用 [index]）。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>flatten_json</code></td>
<td>嵌套 ↔ 扁平互转</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-json-flatten
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-json-flatten"</code>。</p>
<h2>用法示例</h2>
<pre><code>把这个嵌套 JSON 展平
→ 调用 flatten_json(data={a:{b:1,c:[2,3]}})
</code></pre>
