<h1>dsh-india · 印度国家</h1>
<h2>工具</h2>
<ul>
<li><code>country_info</code>：返回印度国家（India）完整资料：名称、首都、人口(万)、面积(万平方公里)、货币代码、官方语言、电话区号、顶级域名、大洲、国旗。</li>
<li><code>country_field</code>：按字段名查询印度国家（India）的单项资料（可用于流程取数）。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-india
</code></pre>
