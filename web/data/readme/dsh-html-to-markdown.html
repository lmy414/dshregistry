<h1>dsh-html-to-markdown · HTML 转 Markdown</h1>
<p>纯 Node 实现，无网络、无外部服务。</p>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-html-to-markdown
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-html-to-markdown"</code>。</p>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-html-to-markdown
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
