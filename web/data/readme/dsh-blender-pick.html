<h1>dsh-blender-pick · 料理机选择</h1>
<h2>工具</h2>
<ul>
<li><code>blender_pick</code>：料理机选择：按参数精确计算，返回选购建议。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-blender-pick
</code></pre>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-blender-pick
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
