<h1>dsh-url · URL 工具</h1>
<p>解析 URL 为结构化成分，或用参数构造 URL。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>parse_url</code></td>
<td>解析 URL → 协议/主机/端口/路径/查询参数</td>
</tr>
<tr>
<td><code>build_url</code></td>
<td>用参数构造 URL</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-url
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-url"</code>。</p>
<h2>用法示例</h2>
<pre><code>解析这个地址的查询参数
→ 调用 parse_url(url="https://a.com/p?x=1&amp;y=2")
</code></pre>
