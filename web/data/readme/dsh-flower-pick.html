<h2>工具</h2>
<ul>
<li><code>flower_pick</code>：花材选择：按参数返回插花花艺方案。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-flower-pick

<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-flower-pick
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
