<h1>dsh-regex · 正则工具</h1>
<p>测试正则匹配（位置/分组）、安全替换、特殊字符转义。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>regex_test</code></td>
<td>测试匹配</td>
</tr>
<tr>
<td><code>regex_replace</code></td>
<td>正则替换</td>
</tr>
<tr>
<td><code>regex_escape</code></td>
<td>特殊字符转义</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add @i6060/dsh-regex
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-regex"</code>。</p>
<h2>用法示例</h2>
<pre><code>测试这个正则能匹配到什么
→ 调用 regex_test(pattern="\\d+", text="a1b22c333")
</code></pre>
