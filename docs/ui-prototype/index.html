<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSH-Registry · 索引 UI 原型</title>
<style>
/* ===== 设计令牌(与站点一致) ===== */
:root {
  --dsh-radius-sm: 4px; --dsh-radius-md: 6px; --dsh-radius-lg: 8px; --dsh-radius-full: 9999px;
  --dsh-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --dsh-font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --dsh-text-xs: 11px; --dsh-text-sm: 12px; --dsh-text-base: 14px; --dsh-text-lg: 15px; --dsh-text-xl: 18px;
  --dsh-bg: #ffffff; --dsh-bg-subtle: #f6f8fa; --dsh-bg-muted: #f0f3f6;
  --dsh-surface: #ffffff; --dsh-surface-hover: #f6f8fa; --dsh-surface-active: #eaeef2;
  --dsh-border: #d0d7de; --dsh-border-muted: #e6eaef; --dsh-border-subtle: #eef1f4;
  --dsh-fg: #1f2328; --dsh-fg-muted: #656d76; --dsh-fg-subtle: #8c959f; --dsh-fg-on-emphasis: #ffffff;
  --dsh-primary: #0969da; --dsh-primary-hover: #0860c8; --dsh-primary-active: #0758b7; --dsh-primary-subtle: #ddf4ff;
  --dsh-state-success: #1a7f37; --dsh-state-success-subtle: #dafbe1;
  --dsh-state-warning: #9a6700; --dsh-state-warning-subtle: #fff8c5;
  --dsh-state-error: #cf222e; --dsh-state-error-subtle: #ffebe9;
  --dsh-trust-unreviewed-bg: #f0f3f6; --dsh-trust-unreviewed-fg: #656d76; --dsh-trust-unreviewed-border: #d0d7de;
  --dsh-trust-vouched-bg: #ddf4ff; --dsh-trust-vouched-fg: #0969da; --dsh-trust-vouched-border: #b6dbff;
  --dsh-trust-flagged-bg: #ffebe9; --dsh-trust-flagged-fg: #cf222e; --dsh-trust-flagged-border: #ff8182;
  --dsh-code-bg: #f6f8fa; --dsh-code-fg: #1f2328; --dsh-code-border: #e6eaef;
  --dsh-shadow-sm: 0 1px 2px rgba(9,105,218,.05); --dsh-shadow-md: 0 4px 12px rgba(9,105,218,.1);
}
html.dark {
  --dsh-bg: #0d1117; --dsh-bg-subtle: #161b22; --dsh-bg-muted: #21262d;
  --dsh-surface: #161b22; --dsh-surface-hover: #1c2128; --dsh-surface-active: #2d333b;
  --dsh-border: #30363d; --dsh-border-muted: #21262d; --dsh-border-subtle: #1c2128;
  --dsh-fg: #e6edf3; --dsh-fg-muted: #9198a1; --dsh-fg-subtle: #6e7681;
  --dsh-primary: #4493f8; --dsh-primary-subtle: rgba(68,147,248,.12);
  --dsh-trust-unreviewed-bg: #21262d; --dsh-trust-unreviewed-fg: #9198a1; --dsh-trust-unreviewed-border: #30363d;
  --dsh-trust-vouched-bg: rgba(68,147,248,.12); --dsh-trust-vouched-fg: #4493f8; --dsh-trust-vouched-border: rgba(68,147,248,.4);
  --dsh-code-bg: #161b22; --dsh-code-fg: #e6edf3; --dsh-code-border: #30363d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--dsh-bg); color: var(--dsh-fg); font-family: var(--dsh-font-sans); font-size: var(--dsh-text-base); line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--dsh-primary); text-decoration: none; }
a:hover { text-decoration: underline; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
code { font-family: var(--dsh-font-mono); font-size: 12.5px; }

/* ===== 顶栏 ===== */
.site-header { position: sticky; top: 0; z-index: 100; background: var(--dsh-bg); border-bottom: 1px solid var(--dsh-border-subtle); backdrop-filter: saturate(180%) blur(8px); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 52px; }
.nav-left { display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--dsh-fg); }
.brand-logo { width: 26px; height: 26px; border-radius: 6px; }
.brand-slogan { font-size: var(--dsh-text-sm); color: var(--dsh-fg-subtle); font-weight: 400; }
.nav-links { display: flex; gap: 2px; list-style: none; margin: 0; padding: 0; }
.nav-links a { display: inline-flex; align-items: center; height: 32px; padding: 0 10px; font-size: var(--dsh-text-sm); color: var(--dsh-fg-muted); border-radius: var(--dsh-radius-md); }
.nav-links a.active { color: var(--dsh-fg); font-weight: 600; background: var(--dsh-bg-subtle); }
.nav-right { display: flex; align-items: center; gap: 8px; }
.theme-toggle { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; background: var(--dsh-bg-subtle); border: 1px solid var(--dsh-border-muted); border-radius: var(--dsh-radius-md); color: var(--dsh-fg-muted); cursor: pointer; }

/* ===== 搜索主场 ===== */
.search-hero { padding: 48px 0 24px; text-align: center; }
.search-hero h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
.search-hero .sub { color: var(--dsh-fg-muted); font-size: var(--dsh-text-sm); margin: 0 0 20px; }
.search-box-wrap { max-width: 640px; margin: 0 auto; position: relative; }
.search-box { width: 100%; height: 44px; padding: 0 16px 0 40px; font: inherit; font-size: var(--dsh-text-lg); color: var(--dsh-fg); background: var(--dsh-bg-subtle); border: 1px solid var(--dsh-border); border-radius: var(--dsh-radius-lg); outline: none; transition: border-color .15s, box-shadow .15s; }
.search-box:focus { border-color: var(--dsh-primary); box-shadow: 0 0 0 3px var(--dsh-primary-subtle); background: var(--dsh-bg); }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--dsh-fg-subtle); pointer-events: none; }
.quick-cats { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 16px; margin-top: 14px; font-size: var(--dsh-text-sm); }
.quick-cats a { color: var(--dsh-fg-muted); }
.quick-cats a:hover { color: var(--dsh-primary); text-decoration: none; }

/* ===== 结果区 ===== */
.results-area { padding: 8px 0 48px; display: none; }
.results-area.show { display: block; }
.results-layout { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: start; }
.results-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.results-count { font-size: var(--dsh-text-sm); color: var(--dsh-fg-muted); }
.results-count strong { color: var(--dsh-fg); font-weight: 600; }
.sort-select { height: 28px; font: inherit; font-size: var(--dsh-text-sm); color: var(--dsh-fg-muted); background: var(--dsh-bg-subtle); border: 1px solid var(--dsh-border-muted); border-radius: var(--dsh-radius-md); padding: 0 8px; cursor: pointer; }

/* Facet 面板 */
.facet-panel { border: 1px solid var(--dsh-border-muted); border-radius: var(--dsh-radius-lg); padding: 14px 16px; }
.facet-group { padding: 10px 0; border-bottom: 1px solid var(--dsh-border-subtle); }
.facet-group:last-child { border-bottom: none; }
.facet-title { font-size: var(--dsh-text-xs); font-weight: 600; color: var(--dsh-fg-subtle); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
.facet-item { display: flex; align-items: center; gap: 8px; font-size: var(--dsh-text-sm); color: var(--dsh-fg-muted); padding: 3px 0; cursor: pointer; }
.facet-item:hover { color: var(--dsh-fg); }
.facet-item input { accent-color: var(--dsh-primary); }
.facet-search { width: 100%; height: 26px; padding: 0 8px; font: inherit; font-size: var(--dsh-text-xs); color: var(--dsh-fg); background: var(--dsh-bg-subtle); border: 1px solid var(--dsh-border-muted); border-radius: var(--dsh-radius-sm); outline: none; margin-bottom: 6px; }
.facet-search:focus { border-color: var(--dsh-primary); }
.facet-more { font-size: var(--dsh-text-xs); color: var(--dsh-fg-subtle); padding: 4px 0 0; cursor: pointer; }
.facet-more:hover { color: var(--dsh-primary); }
.facet-count { margin-left: auto; font-size: var(--dsh-text-xs); color: var(--dsh-fg-subtle); }

/* 结果列表行 */
.result-list { display: flex; flex-direction: column; }
.result-row { padding: 12px 14px; border-radius: var(--dsh-radius-md); border: 1px solid transparent; }
.result-row:hover { background: var(--dsh-surface-hover); border-color: var(--dsh-border-muted); }
.result-row + .result-row { border-top: 1px solid var(--dsh-border-subtle); }
.result-row + .result-row:hover { border-top-color: var(--dsh-border-muted); }
.row-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-name { font-size: var(--dsh-text-lg); font-weight: 600; color: var(--dsh-fg); }
.row-name:hover { color: var(--dsh-primary); }
.row-cat { font-size: var(--dsh-text-xs); color: var(--dsh-fg-subtle); border: 1px solid var(--dsh-border-muted); border-radius: var(--dsh-radius-sm); padding: 0 6px; }
.row-by { font-size: var(--dsh-text-sm); color: var(--dsh-fg-subtle); }
.row-desc { font-size: var(--dsh-text-sm); color: var(--dsh-fg-muted); margin-top: 3px; line-height: 1.55; }
.row-meta { display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: var(--dsh-text-xs); color: var(--dsh-fg-subtle); }
.row-meta .stars { color: var(--dsh-fg-muted); }
.row-meta .row-author { color: var(--dsh-fg-muted); }
.row-meta .stars svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 2px; color: #e3b341; }
.row-meta .src-tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: var(--dsh-radius-full); font-weight: 500; }
.src-tag.github { background: var(--dsh-bg-muted); color: var(--dsh-fg-muted); }
.src-tag.dshfind { background: #ddf4ff; color: #0969da; }
.src-tag.hub { background: #dafbe1; color: #1a7f37; }
html.dark .src-tag.dshfind { background: rgba(68,147,248,.15); color: #4493f8; }
html.dark .src-tag.hub { background: rgba(63,185,80,.15); color: #3fb950; }
.install-toggle { cursor: pointer; color: var(--dsh-primary); }
.install-toggle:hover { text-decoration: underline; }
.install-code { display: none; margin-top: 8px; background: var(--dsh-code-bg); border: 1px solid var(--dsh-code-border); border-radius: var(--dsh-radius-md); padding: 8px 12px; font-family: var(--dsh-font-mono); font-size: 12px; overflow-x: auto; }
.install-code.show { display: block; }
/* 外部评分徽章(dshfind 数据源) */
.score-badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: var(--dsh-radius-full); background: #f3f6ff; border: 1px solid #d6e4ff; color: #3b5bdb; font-size: var(--dsh-text-xs); font-weight: 600; cursor: help; }
html.dark .score-badge { background: rgba(68,147,248,.12); border-color: rgba(68,147,248,.35); color: #4493f8; }
.badge-chip { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: var(--dsh-radius-full); font-size: 10px; font-weight: 500; }
.badge-chip.premium { background: #fff8c5; color: #9a6700; border: 1px solid #eed888; }
.badge-chip.beta { background: #dafbe1; color: #1a7f37; border: 1px solid #aceebb; }
html.dark .badge-chip.premium { background: rgba(210,153,34,.2); color: #d29922; border-color: rgba(210,153,34,.4); }
html.dark .badge-chip.beta { background: rgba(63,185,80,.15); color: #3fb950; border-color: rgba(63,185,80,.4); }
.score-tip { display: none; }
/* 精选答案位 */
.featured-wrap { border: 1px solid var(--dsh-primary); border-radius: var(--dsh-radius-lg); padding: 2px; background: var(--dsh-primary-subtle); margin-bottom: 10px; }
.featured-wrap .result-row { border: none; }
.featured-wrap .result-row:hover { background: transparent; }
.featured-tag { display: inline-block; font-size: 10px; font-weight: 700; color: var(--dsh-primary); letter-spacing: .05em; margin: 2px 0 0 8px; }
/* 联想下拉 */
.suggest-drop { position: absolute; top: 50px; left: 0; right: 0; background: var(--dsh-bg); border: 1px solid var(--dsh-border); border-radius: var(--dsh-radius-lg); box-shadow: var(--dsh-shadow-md); z-index: 50; display: none; overflow: hidden; }
.suggest-drop.show { display: block; }
.suggest-item { padding: 8px 14px; font-size: var(--dsh-text-sm); color: var(--dsh-fg); cursor: pointer; display: flex; align-items: center; gap: 8px; }
.suggest-item:hover { background: var(--dsh-surface-hover); }
.suggest-item .s-k { color: var(--dsh-fg-subtle); font-size: 10px; background: var(--dsh-bg-muted); border-radius: var(--dsh-radius-sm); padding: 1px 5px; }
/* 零结果引导 */
.empty-suggest { margin-top: 8px; font-size: var(--dsh-text-sm); color: var(--dsh-fg-muted); }
.empty-suggest a { margin: 0 6px; }
/* 主区两栏布局 */
.page-layout { display: grid; grid-template-columns: 1fr 240px; gap: 28px; align-items: start; padding: 8px 0 48px; }
.content-col { min-width: 0; }
.side-col { position: sticky; top: 64px; }
@media (max-width: 900px) { .page-layout { grid-template-columns: 1fr; } .side-col { display: none; } }
/* 热度榜(右侧边栏) */
.trending { border: 1px solid var(--dsh-border-muted); border-radius: var(--dsh-radius-lg); overflow: hidden; }
.trending-head { padding: 12px 14px 8px; border-bottom: 1px solid var(--dsh-border-subtle); }
.trending-head h2 { font-size: var(--dsh-text-base); font-weight: 700; margin: 0; }
.side-note { padding: 8px 14px 10px; font-size: var(--dsh-text-xs); color: var(--dsh-fg-subtle); }
.trend-more { padding: 8px 14px; font-size: var(--dsh-text-xs); color: var(--dsh-primary); cursor: pointer; border-top: 1px solid var(--dsh-border-subtle); text-align: center; }
.trend-more:hover { background: var(--dsh-surface-hover); }
.trend-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; }
.trend-row:hover { background: var(--dsh-surface-hover); }
.trend-row + .trend-row { border-top: 1px solid var(--dsh-border-subtle); }
.trend-rank { width: 16px; font-size: var(--dsh-text-sm); font-weight: 700; color: var(--dsh-fg-subtle); text-align: center; }
.trend-row:nth-child(-n+3) .trend-rank { color: #e3b341; }
.trend-name { font-weight: 600; font-size: var(--dsh-text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trend-author { font-size: var(--dsh-text-xs); color: var(--dsh-fg-subtle); }
.trend-growth { margin-left: auto; font-size: var(--dsh-text-xs); font-weight: 600; color: var(--dsh-state-success); white-space: nowrap; }
/* 命中高亮 */
mark { background: #fff8c5; color: inherit; border-radius: 2px; padding: 0 1px; }
html.dark mark { background: rgba(210,153,34,.35); }
/* 网页行 */
.row-url { color: var(--dsh-fg-subtle); }
.webpage-row .row-name { font-weight: 500; }
/* 空态 */
.empty { padding: 40px 0; text-align: center; color: var(--dsh-fg-muted); font-size: var(--dsh-text-sm); }

/* ===== 页脚 ===== */
.site-footer { border-top: 1px solid var(--dsh-border-subtle); padding: 20px 0; }
.footer-inner { display: flex; align-items: center; justify-content: space-between; font-size: var(--dsh-text-sm); color: var(--dsh-fg-subtle); }
.footer-links a { color: var(--dsh-fg-muted); margin-left: 14px; }

/* 信任徽章 */
.trust-badge { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; font-size: var(--dsh-text-xs); font-weight: 500; border-radius: var(--dsh-radius-full); border: 1px solid; white-space: nowrap; }
.trust-badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .8; }
.trust-badge.unreviewed { background: var(--dsh-trust-unreviewed-bg); color: var(--dsh-trust-unreviewed-fg); border-color: var(--dsh-trust-unreviewed-border); }
.trust-badge.vouched { background: var(--dsh-trust-vouched-bg); color: var(--dsh-trust-vouched-fg); border-color: var(--dsh-trust-vouched-border); }
.trust-badge.flagged { background: var(--dsh-trust-flagged-bg); color: var(--dsh-trust-flagged-fg); border-color: var(--dsh-trust-flagged-border); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="nav-inner">
      <div class="nav-left">
        <a href="#" class="brand"><img src="logo.png" alt="DSH-Registry" class="brand-logo"><span>DSH-Registry</span><span class="brand-slogan">DSH 插件索引</span></a>
        <nav><ul class="nav-links">
          <li><a href="#" class="active">搜索</a></li>
          <li><a href="#">分类</a></li>
          <li><a href="#">关于</a></li>
          <li><a href="#">提交插件</a></li>
        </ul></nav>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" id="themeBtn" title="切换主题">◐</button>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <!-- 搜索主场 -->
  <section class="search-hero">
    <h1>搜索 DSH 插件</h1>
    <p class="sub">检索 GitHub 插件、dshfind 与 DSH Hub 的收录页面 —— 全部来自同一索引</p>
    <div class="search-box-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
      <input class="search-box" id="searchInput" placeholder="搜索插件名称、功能或 README 内容…" autocomplete="off">
      <div class="suggest-drop" id="suggestDrop"></div>
    </div>
    <div class="quick-cats" id="quickCats"></div>
  </section>

  <!-- 主区: 内容 + 右侧边栏 -->
  <div class="page-layout">
    <!-- 内容列: 结果区 -->
    <div class="content-col">
      <section class="results-area show">
        <div class="results-layout">
          <!-- Facet 面板 -->
          <aside class="facet-panel">
            <div class="facet-group">
              <div class="facet-title">来源</div>
              <label class="facet-item"><input type="checkbox" data-facet="src" value="github" checked> GitHub<em class="facet-count" id="fc-github"></em></label>
              <label class="facet-item"><input type="checkbox" data-facet="src" value="dshfind"> dshfind<em class="facet-count" id="fc-dshfind"></em></label>
              <label class="facet-item"><input type="checkbox" data-facet="src" value="hub"> DSH Hub<em class="facet-count" id="fc-hub"></em></label>
            </div>
            <div class="facet-group">
              <div class="facet-title">分类</div>
              <div id="catFacets"></div>
            </div>
            <div class="facet-group">
              <div class="facet-title">信任状态</div>
              <label class="facet-item"><input type="checkbox" data-facet="state" value="community"> 社区认可</label>
              <label class="facet-item"><input type="checkbox" data-facet="state" value="unreviewed"> 未审计</label>
            </div>
            <div class="facet-group">
              <div class="facet-title">作者</div>
              <input class="facet-search" id="authorSearch" placeholder="筛选作者…" autocomplete="off">
              <div id="authorFacets"></div>
            </div>
            <div class="facet-group">
              <div class="facet-title">Stars</div>
              <label class="facet-item"><input type="radio" name="stars" data-facet="stars" value="" checked> 全部</label>
              <label class="facet-item"><input type="radio" name="stars" data-facet="stars" value="100"> ≥ 100</label>
              <label class="facet-item"><input type="radio" name="stars" data-facet="stars" value="500"> ≥ 500</label>
            </div>
          </aside>

          <!-- 结果列表 -->
          <div>
            <div class="results-meta">
              <span class="results-count" id="resultCount"></span>
              <select class="sort-select" id="sortSelect">
                <option value="relevance" selected>相关度</option>
                <option value="stars">Stars 最多</option>
                <option value="updated">最近更新</option>
              </select>
            </div>
            <div class="result-list" id="resultList"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- 右侧边栏: 推荐元素 -->
    <aside class="side-col">
      <section class="trending">
        <div class="trending-head">
          <h2>🔥 24 小时热度</h2>
        </div>
        <div class="trending-list" id="trendingList"></div>
        <div class="trend-more" id="trendMore">展开全部</div>
        <div class="side-note">按 star 增长排序 · 每 6 小时更新</div>
      </section>

      <!-- 作者榜: 按插件数量 -->
      <section class="trending" style="margin-top: 16px;">
        <div class="trending-head">
          <h2>👤 作者榜</h2>
        </div>
        <div class="trending-list" id="authorRankList"></div>
        <div class="trend-more" id="authorRankMore">展开全部</div>
        <div class="side-note">按收录插件数量 · 点击作者查看其插件</div>
      </section>
    </aside>
  </div>

function parseQuery(q) {

    state:'state', 状态:'state', src:'src', site:'src', 来源:'src', score:'score', 评分:'score' }
  const filters = { cat:null, author:null, stars:null, state:null, src:null, score:null }
  const keywords = []
  for (const token of q.trim().split(/\s+/)) {
    if (!token) continue
    if (token.startsWith('@')) { filters.author = token.slice(1); continue }
    const m = token.match(/^([a-z\u4e00-\u9fa5]+):(.+)$/i)
    if (m) {

      else if (key === 'score') filters.score = v.toUpperCase()

}

      state.query = t.dataset.suggest
      input.value = state.query
      drop.classList.remove('show')
      render()
    }
    if (t.dataset.install !== undefined) {
      const code = document.getElementById('ic-' + t.dataset.install)
      if (code) { code.classList.toggle('show'); t.textContent = code.classList.contains('show') ? '收起' : '安装 ›' }
      e.preventDefault()
    }
    if (t.dataset.qcat) {
      e.preventDefault()
      state.cats.clear()
      if (t.dataset.qcat !== 'all') state.cats.add(t.dataset.qcat)
      document.querySelectorAll('[data-facet="cat"]').forEach(c => c.checked = state.cats.has(c.value))
      render()
    }
    if (!t.closest('.search-box-wrap')) drop.classList.remove('show')
  })
  document.getElementById('sortSelect').addEventListener('change', e => { state.sort = e.target.value; render() })
  document.addEventListener('change', e => {
    const el = e.target
    if (el.dataset.facet === 'cat') { el.checked ? state.cats.add(el.value) : state.cats.delete(el.value); render() }
    else if (el.dataset.facet === 'author') { el.checked ? state.authors.add(el.value) : state.authors.delete(el.value); render() }
    else if (el.dataset.facet === 'src') { el.checked ? state.srcs.add(el.value) : state.srcs.delete(el.value); render() }
    else if (el.dataset.facet === 'state') { el.checked ? state.states.add(el.value) : state.states.delete(el.value); render() }
    else if (el.dataset.facet === 'stars') { state.stars = el.value; render() }
  })
  document.addEventListener('click', e => {
    const t = e.target
    if (t.dataset.install !== undefined) {
      const code = document.getElementById('ic-' + t.dataset.install)
      if (code) { code.classList.toggle('show'); t.textContent = code.classList.contains('show') ? '收起' : '安装 ›' }
      e.preventDefault()
    }
    if (t.dataset.qcat) {
      e.preventDefault()
      state.cats.clear()
      if (t.dataset.qcat !== 'all') state.cats.add(t.dataset.qcat)
      document.querySelectorAll('[data-facet="cat"]').forEach(c => c.checked = state.cats.has(c.value))
      render()
    }
  })
  document.getElementById('themeBtn').addEventListener('click', () => {
    document.documentElement.classList.toggle('dark')
  })
  document.getElementById('authorSearch').addEventListener('input', renderCats)
}
let trendingExpanded = false
let authorRankExpanded = false
// 作者榜演示数据(真实实现: 从 plugins.json 按 author 统计)
const AUTHOR_STATS = [
  { name: 'omdsh-dev', count: 4 }, { name: 'liustack', count: 3 }, { name: 'mnemon-dev', count: 2 },
  { name: 'ccch1mneyyy', count: 2 }, { name: 'anionex', count: 2 }, { name: 'Nagi-ovo', count: 2 },
  { name: 'Han-1413141', count: 1 }, { name: 'vlln', count: 1 }, { name: 'hellodigua', count: 1 },
]
function renderTrending() {
  const list = document.getElementById('trendingList')
  const all = DATA.filter(d => d.kind === 'plugin' && d.growth).sort((a, b) => b.growth - a.growth)
  const top = trendingExpanded ? all : all.slice(0, 5)
  list.innerHTML = top.map((d, i) => `<div class="trend-row" data-suggest="${d.name}">
    <span class="trend-rank">${i + 1}</span>
    <span class="trend-name">${esc(d.name)}</span>
    <span class="trend-author">${esc(d.author)}</span>
    <span class="trend-growth">+${d.growth}★</span>
  </div>`).join('')
  const more = document.getElementById('trendMore')
  if (more) more.textContent = trendingExpanded ? '收起' : `展开全部 (${all.length})`
}
document.addEventListener('click', e => {
  if (e.target.id === 'trendMore') { trendingExpanded = !trendingExpanded; renderTrending() }
  if (e.target.id === 'authorRankMore') { authorRankExpanded = !authorRankExpanded; renderAuthorRank() }
})
function renderAuthorRank() {
  const list = document.getElementById('authorRankList')
  const sorted = [...AUTHOR_STATS].sort((a, b) => b.count - a.count)
  const top = authorRankExpanded ? sorted : sorted.slice(0, 5)
  list.innerHTML = top.map((a, i) => `<div class="trend-row" data-suggest="@${a.name}">
    <span class="trend-rank">${i + 1}</span>
    <span class="trend-name">${esc(a.name)}</span>
    <span class="trend-growth" style="color:var(--dsh-fg-muted)">${a.count} 个插件</span>
  </div>`).join('')
  const more = document.getElementById('authorRankMore')
  if (more) more.textContent = authorRankExpanded ? '收起' : `展开全部 (${sorted.length})`
}

renderCats(); wire(); renderTrending(); renderAuthorRank(); render()
</script>
