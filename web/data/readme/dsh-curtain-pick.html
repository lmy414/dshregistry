<h1>dsh-curtain-pick · 窗帘选择</h1>
<h2>工具</h2>
<ul>
<li><code>curtain_pick</code>：窗帘选择：按参数返回家居软装搭配方案。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-curtain-pick
</code></pre>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-curtain-pick
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
