</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-move-plan

<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-move-plan
</code></pre>
<h2>使用</h2>
