<h1>dsh-semver · 版本比较</h1>
<p>语义化版本比较与范围判断。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>compare_versions</code></td>
<td>比较版本大小 / 判断是否满足范围</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-semver
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-semver"</code>。</p>
<h2>用法示例</h2>
<pre><code>1.2.3 和 1.10.0 谁新
→ 调用 compare_versions(a="1.2.3", b="1.10.0")
</code></pre>
