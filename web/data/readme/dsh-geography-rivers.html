<h1>dsh-geography-rivers · 世界大河</h1>
<h2>工具</h2>
<ul>
<li><code>list_river</code>：列出 世界大河 条目。</li>
<li><code>get_river</code>：按 id 或名称查询 世界大河 条目详情。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-geography-rivers
</code></pre>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-geography-rivers
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
