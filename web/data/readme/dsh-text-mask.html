<h1>dsh-text-mask · 文本脱敏</h1>
<p>把文本中的敏感信息（邮箱、手机号、身份证号、银行卡号、IP、密钥/令牌）替换为掩码，返回脱敏文本与命中计数。纯 Node 实现，无网络、无外部服务。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>mask_text</code></td>
<td>脱敏文本中的 PII 与密钥</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-text-mask
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-text-mask"</code>。</p>
<h2>用法示例</h2>
<pre><code>把这段日志里的敏感信息脱敏后再给我
→ 调用 mask_text(text="...")
</code></pre>
