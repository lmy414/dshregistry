<h1>dsh-lip-pick · 口红选择</h1>
<h2>工具</h2>
<ul>
<li><code>lip_pick</code>：口红选择：按参数返回日常化妆方案。</li>
</ul>
<p>纯 Node 实现，无网络依赖。</p>
<pre><code>dsh plugin add github:uckkk/dsh-lip-pick
</code></pre>
<h2>安装</h2>
<pre><code>dsh plugin add github:uckkk/dsh-lip-pick
</code></pre>
<h2>使用</h2>
<p>安装后在会话中调用该插件注册的工具即可。</p>
