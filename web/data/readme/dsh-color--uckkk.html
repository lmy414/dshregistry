<h1>dsh-color · 颜色工具</h1>
<p>hex / rgb / hsl 互转，计算补色、明暗与前景文字对比度。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>color_convert</code></td>
<td>颜色三格式互转 + 补色 + 对比度</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add @i6060/dsh-color
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-color"</code>。</p>
<h2>用法示例</h2>
<pre><code>这个颜色 #3b82f6 的 rgb 和 hsl 是什么，配什么文字颜色
→ 调用 color_convert(color="#3b82f6")
</code></pre>
