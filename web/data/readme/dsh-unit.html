<h1>dsh-unit · 单位换算</h1>
<p>长度/重量/温度/数据量/时间单位换算。纯 Node 实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>convert_unit</code></td>
<td>数值单位换算</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-unit
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-unit"</code>。</p>
<h2>用法示例</h2>
<pre><code>10 公里等于多少英里
→ 调用 convert_unit(value=10, from="km", to="mi")
</code></pre>
