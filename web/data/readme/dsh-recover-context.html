<h1>dsh-recover-context</h1>
<blockquote>
<p>v1.0.4</p>
</blockquote>
<p>恢复上下文插件</p>
<ul>
<li>**↶ **：点击后，<strong>这个问题及其之后的所有内容</strong>（对话上下文 + 工作区里产生的文件变更）都会被回退掉——旧会话归档保留日志，新会话从提问之前继续。之后你可以换个方向重新提问，模型不会再被错误的上下文干扰。</li>
<li>**✎ **点击把原问题文本载入输入框，<strong>此时不改变任何上下文</strong>；编辑后提交的那一瞬间执行回退并重新提问。</li>
</ul>
<h2>安装</h2>
<pre><code>dsh plugin --profile web add dsh-recover-context@latest
</code></pre>
