<h1>dsh-random · 随机工具</h1>
<p>安全随机整数/字符串、数组抽样与洗牌。纯 Node（crypto）实现。</p>
<h2>提供的工具</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>作用</th>
</tr>
</thead>
<tbody><tr>
<td><code>random_int</code></td>
<td>随机整数</td>
</tr>
<tr>
<td><code>random_string</code></td>
<td>随机字符串</td>
</tr>
<tr>
<td><code>random_pick</code></td>
<td>抽样/洗牌</td>
</tr>
</tbody></table>
<h2>安装</h2>
<pre><code>dsh plugin add dsh-random
</code></pre>
<p>安装后在 profile 的 <code>package.json</code> 的 <code>dsh.profile.bundles</code> 中加入 <code>"dsh-random"</code>。</p>
<h2>用法示例</h2>
<pre><code>生成一个 6 位数字验证码
→ 调用 random_string(length=6, charset="digit")
</code></pre>
