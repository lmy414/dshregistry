<h1>dsh-knj-menu</h1>
<p>第三方菜单管理器（DeepSeek Harness 插件）</p>
<p>统一收纳第三方插件新增的菜单入口，提供常驻 / 折叠 + 📌 固定。</p>
<h2>功能</h2>
<ul>
<li>收集第三方插件通过 <code>dsh.bundle</code> 声明的菜单入口</li>
<li>常驻模式：菜单始终显示</li>
<li>折叠模式：收起为图标，点击展开</li>
<li>📌 固定：常用菜单置顶，不随折叠隐藏</li>
</ul>
<h2>安装</h2>
<pre><code>dsh plugin --profile web add dsh-knj-menu
</code></pre>
<h2>要求</h2>
<ul>
<li><code>dsh web</code> &gt;= 0.1.0-rc.6</li>
</ul>
